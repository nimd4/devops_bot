services:
  db:
    build:
      context: ./db
    container_name: postgres-master
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build:
      context: ./bot

    container_name: telegram-bot
    restart: always
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
